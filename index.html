<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Assignment</title>

    <style>
        h1{
            text-align: center;
            text-transform: uppercase;
            font-style: italic;
            background-color: #f2f2f2;
        }

        .content{
            display: flex;
            text-align: justify;
            font-size: 16px;
            line-height: 1.5;
            background-color: #ddcccc;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        .box{
            width: 50px;
            height: 50px;
            background-color: #f2f2f2;
            margin: 10px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="text"]{
            width: 20%;
            padding: 10px;
            margin: 10px 0;
            border: 3px solid #d4743460;
            border-radius: 5px;
        }

        input[type="text"]:focus{
            border-color: #d47434;
            outline: none;
        }

        button{
            background-color: #39d434;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover{
            background-color: #a3522c;
            cursor: pointer;
            font-weight: bold;
        }

        body{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<body>

    <h1 id="header">Hello</h1>

    <hr style="border: 2px solid rgb(14, 153, 153);">

    <div class="content">
        <div class="box" id="box1">box 1</div>
        <div class="box" id="box2">box 2</div>
        <div class="box" id="box3">box 3</div>
        <div class="box" id="box4">box 4</div>
    </div>

    <br><br>

    <input type="text" id="input" placeholder="Enter your name">

    <button id="btn">Click Me</button>

    <script>
        // Selecting elements
        const heading = document.getElementById("header");
        const input = document.getElementById("input");
        const button = document.getElementById("btn");
        const boxes = document.querySelectorAll(".box");

        // Greeting button
        button.addEventListener("click", function () {
            let userName = input.value;

            if (userName.trim() === "") {
                heading.innerText = "Hello";
            } else {
                heading.innerText = `Hello, ${userName}`;
            }
        });

        // Box colour change
        boxes.forEach(function (box) {
            box.addEventListener("click", function () {
                let color = box.innerText.toLowerCase();

                box.style.backgroundColor = color;
                box.style.color = "brown";
            });
        });
    </script>

</body>
</html>
